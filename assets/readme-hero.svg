<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Strata TypeScript SDK</title>
  <desc id="desc">Strata — The deepest book in DeFi.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090c12"/>
      <stop offset=".55" stop-color="#0d111a"/>
      <stop offset="1" stop-color="#090b12"/>
    </linearGradient>
    <radialGradient id="cyanAurora" cx="0" cy="0" r="1" gradientTransform="translate(140 50) rotate(32) scale(530 300)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22d3ee" stop-opacity=".20"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetAurora" cx="0" cy="0" r="1" gradientTransform="translate(1080 330) rotate(-150) scale(520 280)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8b5cf6" stop-opacity=".22"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#22d3ee" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#334155" stop-opacity=".18"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity=".5"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#cbd5e1" stroke-opacity=".035"/>
    </pattern>
  </defs>

  <rect x="1" y="1" width="1198" height="358" rx="27" fill="url(#surface)" stroke="url(#edge)" stroke-width="2"/>
  <rect x="2" y="2" width="1196" height="356" rx="26" fill="url(#cyanAurora)"/>
  <rect x="2" y="2" width="1196" height="356" rx="26" fill="url(#violetAurora)"/>
  <rect x="2" y="2" width="1196" height="356" rx="26" fill="url(#grid)"/>

  <g transform="translate(76 70)">
    <rect width="58" height="11" rx="5.5" fill="#22d3ee"/>
    <rect y="21" width="44" height="11" rx="5.5" fill="#eab308"/>
    <rect y="42" width="29" height="11" rx="5.5" fill="#a78bfa"/>
    <text x="80" y="45" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="48" font-weight="720" letter-spacing="-1">Strata</text>
  </g>

  <text x="76" y="215" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="45" font-weight="650" letter-spacing="-.6">The deepest book in DeFi.</text>
  <text x="78" y="258" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="550" letter-spacing="2.4">TYPESCRIPT SDK + CLI</text>
  <text x="78" y="307" fill="#cbd5e1" fill-opacity=".78" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="16">Markets  ·  Sonar  ·  Trading  ·  Market making</text>
</svg>
